<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Break 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@500&display=swap">
<style>
/* Layout: photo-led trip cards under a sortable at-a-glance table; one column on phones, itinerary days scroll sideways. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5a6573;
  --line: #dde2e8;
  --accent: #1d5a7a;
  --accent-soft: #e2eef4;
  --warm: #b4562a;
  --warm-soft: #f8e7dc;
  --cold: #2c6aa0;
  --cold-soft: #e1ecf7;
  --gold: #9a6b00;
  --gold-soft: #f6ecd2;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --ink: #e8edf2; --muted: #9aa6b3; --line: #2c3540;
    --accent: #7cc0e0; --accent-soft: #1d3442; --warm: #f0a07a; --warm-soft: #3a2519;
    --cold: #8fc0ec; --cold-soft: #1b2d40; --gold: #e3bf62; --gold-soft: #352b12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --ink: #e8edf2; --muted: #9aa6b3; --line: #2c3540;
  --accent: #7cc0e0; --accent-soft: #1d3442; --warm: #f0a07a; --warm-soft: #3a2519;
  --cold: #8fc0ec; --cold-soft: #1b2d40; --gold: #e3bf62; --gold-soft: #352b12;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html[lang="vi"] { --display: "Noto Serif", Georgia, serif; --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
img { max-width: 100%; display: block; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.15; }
.num { font-variant-numeric: tabular-nums; }

/* header */
header.top { padding-block: 32px 8px; }
.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.langs { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; background: var(--surface); }
.langs button { font: 700 0.85rem var(--body); padding: 7px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.gatelangs { justify-self: center; }
.gatelangs button { padding: 8px 16px; font-size: 0.95rem; }
header.top h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 1.05rem; }
.sub b { color: var(--ink); font-weight: 600; }
.jump { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-weight: 600; }

/* filters */
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: 600 0.9rem var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.sep { margin-left: 6px; }
.count { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

/* table */
section { padding-block: 28px 8px; }
section > h2 { font-size: 1.6rem; margin-bottom: 4px; }
.hint { color: var(--muted); margin: 0 0 14px; font-size: 0.95rem; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 3px solid var(--accent); }
th[aria-sort="ascending"] button::after { content: "\25B2"; font-size: 0.65rem; }
th[aria-sort="descending"] button::after { content: "\25BC"; font-size: 0.65rem; }
td.place { min-width: 200px; }
.pl { display: flex; gap: 10px; align-items: center; }
td.place img, td.place .ph { width: 52px; height: 40px; object-fit: cover; border-radius: 6px; flex: none; background: var(--accent-soft); }
td.place a { color: var(--ink); font-weight: 600; text-decoration: none; }
td.place a:hover { text-decoration: underline; }
td.place small { display: block; color: var(--muted); font-weight: 400; }
.big { font-weight: 700; font-size: 1.05rem; }
/* phones: each row becomes a compact two-line tile, no sideways scrolling */
@media (max-width: 640px) {
  table { min-width: 0; }
  thead { display: block; border-bottom: 1px solid var(--line); }
  thead tr { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 10px 12px; }
  th { padding: 0; font-size: 0.7rem; }
  tbody tr { display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: 8px 10px; padding: 12px; border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; }
  td.place { grid-column: 1 / -1; min-width: 0; }
  td.place small { display: none; }
  td:last-child { text-align: right; font-size: 0.85rem; }
  td:last-child small, td:nth-child(2) small { display: none !important; }
  table, tbody { display: block; width: 100%; }
}

/* pills */
.pill { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.warm { background: var(--warm-soft); color: var(--warm); }
.pill.cold { background: var(--cold-soft); color: var(--cold); }
.pill.pass { background: var(--gold-soft); color: var(--gold); }
.pill.nopass { background: var(--accent-soft); color: var(--accent); }
.est { font-size: 0.7rem; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }

/* cards */
.dest { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
/* trip browser: thumbnail strip + one trip at a time with previous / next */
#trips { scroll-margin-top: 8px; }
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 10px; scrollbar-width: thin; }
.strip button { flex: none; width: 128px; scroll-snap-align: start; display: grid; gap: 4px; text-align: left; padding: 0 0 8px; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; }
.strip button[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.strip .th { height: 72px; background: var(--accent-soft); overflow: hidden; }
.strip .th img { width: 100%; height: 100%; object-fit: cover; }
.strip b { font-size: 0.82rem; line-height: 1.2; padding: 0 8px; font-weight: 700; }
.strip small { font-size: 0.78rem; color: var(--muted); padding: 0 8px; font-variant-numeric: tabular-nums; }
.strip .mine { color: var(--accent); font-weight: 700; }
.stepper { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-block: 10px; }
.stepper button { font: 700 0.92rem var(--body); padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper button:last-child { text-align: right; }
.stepper button.next { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.stepper button:disabled { visibility: hidden; }
.stepper .pos { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mosaic { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; height: clamp(220px, 42vw, 380px); background: var(--line); }
.mosaic figure:first-child { grid-row: span 2; }
.mosaic.n1 { grid-template-columns: 1fr; } .mosaic.n1 figure { grid-row: auto; }
.mosaic.n2 { grid-template-rows: 1fr; } .mosaic.n2 figure:first-child { grid-row: auto; }
figure { margin: 0; position: relative; overflow: hidden; background: var(--accent-soft); min-height: 0; }
figure img { width: 100%; height: 100%; object-fit: cover; }
figure .credit {
  position: absolute; right: 0; bottom: 0; max-width: 100%; font-size: 0.66rem; line-height: 1.3;
  background: rgba(0,0,0,0.55); color: #fff; padding: 3px 7px; border-top-left-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
figure .credit a { color: #fff; }
figure.broken img { display: none; }
figure.broken::after { content: attr(data-cap); position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); font-weight: 600; padding: 12px; text-align: center; }
.dbody { padding: 20px clamp(16px, 3vw, 28px) 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.dbody > * { min-width: 0; }
.dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.dhead h3 { font-size: clamp(1.6rem, 4vw, 2.1rem); }
.tag { color: var(--muted); font-size: 1rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.fact { background: var(--bg); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.fact .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
.fact .v { font-size: 1.2rem; font-weight: 700; }
.fact .s { font-size: 0.82rem; color: var(--muted); }
.why { margin: 0; font-size: 1.05rem; }
.why b { font-family: var(--display); font-weight: 400; }

/* itinerary */
.itin h4, .more h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
.days { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
@media (max-width: 640px) {
  .filters { position: static; padding-block: 8px; }
  .days { grid-auto-columns: 82%; margin-inline: -4px; padding-inline: 4px; }
  .dbody { padding: 16px 14px 18px; gap: 14px; }
  .dhead h3 { font-size: 1.55rem; }
  .facts { grid-template-columns: 1fr 1fr; gap: 8px; }
  .facts .fact:first-child { grid-column: 1 / -1; }
  .fact .v { font-size: 1.1rem; }
  .dbody .addbtn { justify-self: stretch; padding: 12px 16px; font-size: 1rem; }
  .mosaic { height: 230px; }
  .why { font-size: 0.98rem; }
  header.top { padding-block: 20px 4px; }
  section { padding-block: 20px 4px; }
  .tbtn { padding: 10px 12px; }
}
@media (min-width: 900px) { .days { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); overflow: visible; } }
.day { scroll-snap-align: start; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: var(--surface); }
.day figure { aspect-ratio: 4 / 3; }
.day .dt { padding: 10px 12px 12px; display: grid; gap: 4px; }
.day .dn { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.day .tt { font-weight: 700; line-height: 1.25; }
.day p { margin: 0; font-size: 0.92rem; color: var(--muted); }
.day .eat { font-size: 0.88rem; color: var(--ink); }
.day .eat b { color: var(--warm); }

/* details */
details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 700; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); font-size: 1rem; }
details[open] > summary::before { content: "\2212"; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 24px; margin-top: 14px; }
.grid2 > div { min-width: 0; }
.grid2 h5 { margin: 0 0 4px; font-size: 0.9rem; }
.grid2 p, .grid2 ul { margin: 0; font-size: 0.93rem; color: var(--muted); }
.grid2 ul { padding-left: 18px; }
.cost td, .cost th { padding: 6px 8px; font-size: 0.9rem; }
.cost table { min-width: 0; }
.ok { color: var(--accent); font-weight: 700; font-size: 0.75rem; }
.unv { color: var(--warm); font-weight: 700; font-size: 0.75rem; }
.sources ol { margin: 10px 0 0; padding-left: 20px; font-size: 0.85rem; color: var(--muted); word-break: break-word; }

/* picks */
.picks { display: grid; gap: 14px; }
.pick { display: grid; grid-template-columns: 140px 1fr; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pick figure { min-height: 120px; }
.pick .pb { padding: 14px 16px 14px 0; min-width: 0; }
.pick .rank { font-family: var(--display); font-size: 1.6rem; color: var(--accent); line-height: 1; }
.pick h3 { font-size: 1.3rem; margin: 4px 0; }
.pick p { margin: 0; color: var(--muted); }
.pick.first { border: 2px solid var(--accent); }
.firstpill { display: inline-block; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; margin-bottom: 6px; letter-spacing: 0.04em; }
@media (max-width: 560px) { .pick { grid-template-columns: 1fr; } .pick figure { height: 160px; } .pick .pb { padding: 0 16px 16px; } }
footer { color: var(--muted); font-size: 0.85rem; padding-block: 24px 40px; }

/* voting: who's viewing gate, add buttons, my-top-5 tray, family result */
body.voting { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.gate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 55%, transparent);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gatebox { background: var(--surface); border-radius: 18px; padding: 24px; width: min(440px, 100%); display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.gatebox h2 { font-size: 1.9rem; }
.gatebox p { margin: 0; color: var(--muted); }
.who { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.who button { font: 700 1.15rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 18px 10px; cursor: pointer; display: grid; gap: 2px; }
.who button:hover { border-color: var(--accent); }
.who button small { font-weight: 500; font-size: 0.8rem; color: var(--muted); }
.who button.done small { color: var(--accent); }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; justify-self: center; }
.linkbtn:focus-visible { outline: 3px solid var(--accent); }
.addbtn { font: 700 0.95rem var(--body); border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 2px solid var(--accent); background: var(--accent); color: var(--bg); justify-self: start; }
.addbtn.in { background: var(--accent-soft); color: var(--accent); }
.addbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.addmini { font: 700 0.8rem var(--body); border-radius: 999px; padding: 4px 10px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; white-space: nowrap; }
.addmini.in { background: var(--accent); color: var(--bg); }
.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.trayin { max-width: 1120px; margin: 0 auto; display: grid; gap: 10px; }
.traybar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.traybar { flex-wrap: nowrap; }
.trayhead { flex: 1; min-width: 0; display: grid; }
.trayhead b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; line-height: 1.2; }
.trayhead .status { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.traymore { display: grid; gap: 8px; }
.traymore .grow { margin: 0; color: var(--muted); font-size: 0.88rem; }
.tbtn { font: 700 0.9rem var(--body); border-radius: 10px; padding: 9px 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.tbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.mylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 46vh; overflow-y: auto; }
.mylist li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 6px 8px; }
.mylist .rk { font-family: var(--display); font-size: 1.3rem; color: var(--accent); text-align: center; }
.mylist .nm { min-width: 0; font-weight: 600; line-height: 1.25; }
.mylist .nm small { display: block; font-weight: 400; color: var(--muted); }
.mylist .ctl { display: flex; gap: 4px; }
.mylist .ctl button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1rem; cursor: pointer; }
.mylist .ctl button:disabled { opacity: 0.3; cursor: default; }
.mylist .empty { display: block; color: var(--muted); background: none; padding: 4px 0; }
.status { font-size: 0.9rem; font-weight: 600; color: var(--accent); }
.status.err { color: var(--warm); }
.family { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px clamp(16px, 3vw, 24px); display: grid; gap: 12px; }
.family h2 { font-size: 1.5rem; }
.family p { margin: 0; color: var(--muted); }
.votedrow { display: flex; flex-wrap: wrap; gap: 8px; }
.votedrow span { font-weight: 700; font-size: 0.85rem; padding: 5px 12px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.votedrow span.yes { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.results li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; }
.results .rk { font-family: var(--display); font-size: 1.5rem; color: var(--accent); text-align: center; }
.results .bar { height: 8px; border-radius: 4px; background: var(--accent); margin-top: 4px; }
.results a { color: var(--ink); font-weight: 600; text-decoration: none; }
.results .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<header class="top wrap">
  <div class="toprow">
    <h1 data-i18n="title">Winter Break 2026</h1>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="vi">VI</button>
    </div>
  </div>
  <p class="sub" data-i18n-html="sub"></p>
  <div class="jump"><a href="#compare" data-i18n="jCompare">Compare all</a><a href="#trips" data-i18n="jTrips">See each trip</a><a href="#picks" data-i18n="jPicks">Our top 5</a></div>
</header>

<section class="wrap" style="padding-block: 8px 16px">
  <div class="family" id="family" aria-live="polite">
    <h2 data-i18n="famTitle">Family vote</h2>
    <p data-i18n="famText"></p>
    <div class="votedrow" id="votedrow"></div>
    <button type="button" class="addbtn" id="startVote" data-i18n="startVote" hidden>Pick your name to vote</button>
    <ol class="results" id="results" hidden></ol>

    pillPass: "Cần hộ chiếu", pillNoPass: "Không cần hộ chiếu", firstPick: "Gợi ý số 1",
    pickMeta: (cost, t, pass) => `<b class="num">${cost}</b> vé bay + chỗ ở &middot; ${t} &middot; ${pass ? "cần hộ chiếu" : "không cần hộ chiếu"}`,
    foot: "Giá tính cho mỗi người: vé máy bay khứ hồi của mỗi người, cộng tiền thuê nhà chia 4 (một phòng cho Ba Mẹ, một phòng cho Emily và Jennifer), tra cứu tháng 10/2026 và có thể thay đổi. \"Đã kiểm tra\" nghĩa là đã thấy giá vé hoặc giá phòng thật; \"ước tính\" là giá thông thường. Ảnh từ Wikimedia Commons, ghi nguồn trên từng ảnh.",
    connErr: "Không kết nối được máy chủ bình chọn. Kiểm tra mạng rồi thử lại.", notConnected: "Chức năng bình chọn chưa được kết nối.", fileCopy: "Bình chọn chỉ hoạt động trên trang web, không phải bản tải về.",
  },
};
const T = (k, ...a) => { const v = STR[LANG][k] ?? STR.en[k]; return typeof v === "function" ? v(...a) : v; };
// translated trip text lives in d.vi (same shape as the English fields); fall back to English
const L = (d, k) => (LANG === "vi" && d.vi && d.vi[k] != null) ? d.vi[k] : d[k];
const LD = (d, i, k) => (LANG === "vi" && d.vi?.itinerary?.[i]?.[k]) || d.itinerary[i][k];
const toC = f => Math.round((f - 32) * 5 / 9);
const temp = (hi, lo) => LANG === "vi" ? `${toC(hi)}&deg; / ${toC(lo)}&deg;C` : `${hi}&deg; / ${lo}&deg;F`;
const temp1 = f => LANG === "vi" ? `${toC(f)}&deg;C` : `${f}&deg;F`;
// "7h 15m nonstop", "22h, 1 stop" -> Vietnamese
const viTime = s => String(s).replace(/~/g, "khoảng ").replace(/(\d+(?:\.\d+)?)h(?:\s*(\d+)m)?/g, (m, h, mm) => `${h} giờ${mm ? ` ${mm} phút` : ""}`);
const flyL = s => LANG !== "vi" ? s : viTime(s).replace(/nonstop out/, "bay thẳng chiều đi").replace(/nonstop/g, "bay thẳng").replace(/(\d) stops?/g, "$1 điểm dừng").replace(/ out\b/g, " chiều đi").replace(/ back\b/g, " chiều về").replace(/home/g, "chiều về").replace(/ each way/g, " mỗi chiều");
const dlL = s => LANG !== "vi" ? s : viTime(s);
const regionL = r => T("regions")[r] || r;
const DATES = {
  en: ["Sat Dec 12", "Sun Dec 13", "Mon Dec 14", "Tue Dec 15", "Wed Dec 16", "Thu Dec 17", "Fri Dec 18", "Sat Dec 19", "Sun Dec 20"],
  vi: ["Thứ Bảy 12/12", "Chủ Nhật 13/12", "Thứ Hai 14/12", "Thứ Ba 15/12", "Thứ Tư 16/12", "Thứ Năm 17/12", "Thứ Sáu 18/12", "Thứ Bảy 19/12", "Chủ Nhật 20/12"],
};
const dateL = i => DATES[LANG][i] || "";
const shortDate = i => LANG === "vi" ? DATES.vi[i].split(" ").pop() : DATES.en[i].slice(4);
const shortName = d => L(d, "name").split(",")[0];

function photo(p, cls = "", link = true) {
  if (!p) return `<figure class="broken ${cls}" data-cap=""></figure>`;
  return `<figure class="${cls}" data-cap="${esc(p.caption)}">
    <img src="${esc(p.src)}" data-orig="${esc(p.orig)}" alt="${esc(p.caption)}" loading="lazy" referrerpolicy="no-referrer">
    <span class="credit">${esc(p.caption)} &middot; ${link ? `<a href="${esc(p.page)}" target="_blank" rel="noopener">${esc(p.author)}, ${esc(p.license)}</a>` : `${esc(p.author)}, ${esc(p.license)}`}</span>
  </figure>`;
}
// If the 960px thumbnail fails (e.g. original smaller than 960px), try the original; then fall back to a caption tile.
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (img.dataset.orig && img.src !== img.dataset.orig) { img.src = img.dataset.orig; return; }
  const fig = img.closest("figure"); if (fig) fig.classList.add("broken");
  else img.style.visibility = "hidden";
}, true);

function card(d) {
  const c = d.costPP, w = d.weather, hero = d.heroPhotos || [];
  const wv = L(d, "weather") || w;
  const days = (d.itinerary || []).map((x, i) => `
    <article class="day">
      ${photo(x.photo)}
      <div class="dt">
        <span class="dn">${T("day", x.day)} &middot; ${dateL(i + (d.start || 0))}</span>
        <span class="tt">${esc(LD(d, i, "title"))}</span>
        <p>${esc(LD(d, i, "plan"))}</p>
        ${x.eat ? `<span class="eat"><b>${T("eat")}</b> ${esc(LD(d, i, "eat"))}</span>` : ""}
      </div>
    </article>`).join("");
  const tick = v => v ? `<span class="ok">${T("checked")}</span>` : `<span class="unv">${T("estimate")}</span>`;
  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  return `
  <article class="dest" id="${esc(d.id)}" data-id="${esc(d.id)}">
    <div class="mosaic n${Math.min(hero.length, 3)}">${hero.slice(0, 3).map(p => photo(p)).join("")}</div>
    <div class="dbody">
      <div class="dhead"><h3>${esc(L(d, "name"))}</h3><span class="tag">${esc(L(d, "tagline"))}</span></div>
      <button type="button" class="addbtn" data-add="${esc(d.id)}" hidden></button>
      <div class="facts">
        <div class="fact"><div class="k">${T("kCost")}</div><div class="v num">${money(c.trip)}</div><div class="s">${T("sCost", money(c.flights), money(c.lodging))}</div></div>
        <div class="fact"><div class="k">${T("kWeather")}</div><div class="v num">${temp(w.highF, w.lowF)}</div><div class="s">${T("sDaylight", esc(dlL(w.daylight)))}</div></div>
        <div class="fact"><div class="k">${T("kPassport")}</div><div class="v">${d.passport ? T("yes") : T("notNeeded")}</div><div class="s">${T("sFlight", esc(flyL(d.fly)), esc(d.flight.from))}</div></div>
      </div>
      <p class="why"><b>${T("why")}</b> ${esc(L(d, "whyParents"))}</p>
      <div class="itin"><h4>${T("week")}${d.start ? ` <span style="text-transform:none;letter-spacing:0;color:var(--warm)">${T("landNote", shortDate(d.start), shortDate(d.start + 6))}</span>` : ""}</h4><div class="days">${days}</div></div>
      <details>
        <summary>${T("details")}</summary>
        <div class="grid2">
          <div><h5>${T("hFlights")}</h5><p>${esc(L(d, "flightText") || `${d.flight.airline}: ${d.flight.routing}${d.flight.notes ? ". " + d.flight.notes : ""}`)}</p></div>
          <div><h5>${T("hStay")}</h5><p>${esc(L(d, "stay"))}</p></div>
          <div><h5>${T("hAround")}</h5><p>${esc(L(d, "getAround"))}</p></div>
          <div><h5>${T("hWeather")}</h5><p>${T("weatherLine", temp1(w.highF), temp1(w.lowF), esc(dlL(w.daylight)))} ${esc(L(d, "precip") || w.precip)}</p></div>
          <div><h5>${T("hEvents")}</h5><ul>${li(L(d, "events"))}</ul></div>
          <div><h5>${T("hEntry")}</h5><p>${esc(L(d, "entry"))}</p></div>
          <div><h5>${T("hGood")}</h5><ul>${li(L(d, "pros"))}</ul></div>
          <div><h5>${T("hWatch")}</h5><ul>${li(L(d, "cons"))}</ul></div>
          <div class="cost"><h5>${T("hCost")}</h5>
            <table><tbody>
              <tr><td>${T("rowFlights")}</td><td class="num">${money(c.flights)}</td><td>${tick(c.flightsVerified)}</td></tr>
              <tr><td>${T("rowStay")}</td><td class="num">${money(c.lodging)}</td><td>${tick(c.lodgingVerified)}</td></tr>
            </tbody></table>
            <p style="margin-top:6px">${T("enOnly")} ${esc(c.flightsBasis)} ${esc(c.lodgingBasis)}</p>
          </div>
          ${(L(d, "unverified") || []).length ? `<div><h5>${T("hUnconfirmed")}</h5><ul>${li(L(d, "unverified"))}</ul></div>` : ""}
        </div>
      </details>
      <details class="sources">
        <summary>${T("sources", (d.sources || []).length)}</summary>
        <ol>${(d.sources || []).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("")}</ol>
      </details>
    </div>
  </article>`;
}

function row(d) {
  const c = d.costPP, w = d.weather, p = (d.heroPhotos || [])[0];
  return `<tr data-id="${esc(d.id)}">
    <td class="place"><div class="pl">${p ? `<img src="${esc(p.src)}" data-orig="${esc(p.orig)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="ph"></span>`}
      <a href="#${esc(d.id)}">${esc(L(d, "name"))}<small>${esc(L(d, "tagline"))}</small></a>
      <button type="button" class="addmini" data-add="${esc(d.id)}" hidden></button></div></td>
    <td class="num"><span class="big">${money(c.trip)}</span><small style="display:block;color:var(--muted)">${money(c.flights)} + ${money(c.lodging)}</small></td>
    <td><span class="pill ${d.warm ? "warm" : "cold"} num">${temp(w.highF, w.lowF)}</span></td>
    <td><span class="pill ${d.passport ? "pass" : "nopass"}">${d.passport ? T("pillPass") : T("pillNoPass")}</span></td>
    <td class="num">${esc(flyL(d.fly))}<small style="display:block;color:var(--muted)">${esc(d.flight.from)}</small></td>
  </tr>`;
}

const dests = DATA.dests;
const byId = Object.fromEntries(dests.map(d => [d.id, d]));
const regions = [...new Set(dests.map(d => d.region))];
const F = { region: "All", temp: "Any", nopass: false };
const sortKeys = {
  name: d => L(d, "name"), trip: d => d.costPP.trip,
  hi: d => d.weather.highF, pass: d => d.passport ? 1 : 0, hrs: hrs,
};
let sort = { k: "trip", dir: 1 };

function chips() {
  const b = (label, on, act, cls = "") => `<button type="button" class="chip ${cls}" aria-pressed="${on}" data-act="${act}">${label}</button>`;
  $("#chips").innerHTML =
    ["All", ...regions].map(r => b(r === "All" ? T("allPlaces") : regionL(r), F.region === r, "region:" + r)).join("") +
    b(T("warm"), F.temp === "Warm", "temp:Warm", "sep") + b(T("cold"), F.temp === "Cold", "temp:Cold") +
    b(T("noPass"), F.nopass, "nopass", "sep");
}
$("#chips").addEventListener("click", e => {
  const a = e.target.closest("button")?.dataset.act; if (!a) return;
  const [k, v] = a.split(":");
  if (k === "region") F.region = v;
  if (k === "temp") F.temp = F.temp === v ? "Any" : v;
  if (k === "nopass") F.nopass = !F.nopass;
  apply();
});

const show = d => (F.region === "All" || d.region === F.region) &&
  (F.temp === "Any" || (F.temp === "Warm") === !!d.warm) && (!F.nopass || !d.passport);

function apply() {
  chips();
  const list = [...dests].sort((a, b) => {
    const x = sortKeys[sort.k](a), y = sortKeys[sort.k](b);
    return (x > y ? 1 : x < y ? -1 : 0) * sort.dir;
  });
  const tb = $("#tbl tbody");
  tb.innerHTML = list.filter(show).map(row).join("") || `<tr><td colspan="5">${T("noMatch")}</td></tr>`;
  document.querySelectorAll("#tbl th").forEach(th => th.setAttribute("aria-sort", th.dataset.k === sort.k ? (sort.dir > 0 ? "ascending" : "descending") : "none"));
  const n = dests.filter(show).length;
  $("#count").textContent = n === dests.length ? T("count", n) : T("showing", n, dests.length);
  renderBrowser();
  syncAddButtons();
}

/* ---------- trip browser: one trip at a time ---------- */
const ORDER = [...dests].sort((a, b) => a.costPP.trip - b.costPP.trip);
let cur = ORDER[0].id;
function renderBrowser() {
  const vis = ORDER.filter(show);
  if (!vis.some(d => d.id === cur) && vis.length) cur = vis[0].id;
  const i = vis.findIndex(d => d.id === cur);
  const mine = id => V.me ? V.list.indexOf(id) : -1;
  $("#strip").innerHTML = vis.map(d => {
    const p = (d.heroPhotos || [])[0], m = mine(d.id);
    return `<button type="button" role="tab" data-go="${esc(d.id)}" aria-selected="${d.id === cur}">
      <span class="th">${p ? `<img src="${esc(p.src)}" data-orig="${esc(p.orig)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</span>
      <b>${esc(shortName(d))}</b>
      <small>${money(d.costPP.trip)} &middot; ${temp1(d.weather.highF)}${m >= 0 ? ` <span class="mine">#${m + 1}</span>` : ""}</small>
    </button>`;
  }).join("");
  document.querySelectorAll(".dest").forEach(el => { el.hidden = el.dataset.id !== cur || !vis.length; });
  const prev = vis[i - 1], next = vis[i + 1];
  const step = `<button type="button" data-go="${prev ? esc(prev.id) : ""}" ${prev ? "" : "disabled"}>&larr; ${prev ? esc(shortName(prev)) : ""}</button>
    <span class="pos">${vis.length ? T("pos", i + 1, vis.length) : T("noTrips")}</span>
    <button type="button" class="next" data-go="${next ? esc(next.id) : ""}" ${next ? "" : "disabled"}>${next ? esc(shortName(next)) : ""} &rarr;</button>`;
  $("#stepTop").innerHTML = step;
  $("#stepBottom").innerHTML = step;
  const sel = $('#strip [aria-selected="true"]');
  if (sel) $("#strip").scrollTo({ left: sel.offsetLeft - 16, behavior: "auto" });
}
function go(id, scroll) {
  if (!byId[id]) return;
  if (!show(byId[id])) { F.region = "All"; F.temp = "Any"; F.nopass = false; }
  cur = id; apply();
  if (scroll) $("#trips").scrollIntoView({ block: "start" });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b && b.dataset.go) { go(b.dataset.go, !!b.closest(".stepper")); return; }
  const a = e.target.closest('a[href^="#"]');
  const id = a && decodeURIComponent(a.getAttribute("href").slice(1));
  if (id && byId[id]) { e.preventDefault(); go(id, true); }
});
const fromHash = () => { const id = decodeURIComponent(location.hash.slice(1)); if (byId[id]) go(id, true); };
window.addEventListener("hashchange", fromHash);

/* ---------- family vote ---------- */
// Same-origin on Vercel; the GitHub Pages copy calls the Vercel deployment.
const VOTE_API = location.hostname.endsWith("github.io") ? "https://family-winter-break.vercel.app/api/votes" : "/api/votes";
const PEOPLE = ["mom", "dad", "emily", "jennifer"];
const label = id => T("people")[id] || "";
const V = { me: store.get("me"), list: [], server: null, open: false, saving: false };
if (V.me) V.list = (store.get("list:" + V.me) || []).filter(id => byId[id]);

async function api(method, body) {
  let r;
  try {
    r = await fetch(VOTE_API, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error(T("connErr")); }
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(LANG === "en" && out.error ? out.error : T("notConnected"));
  return out;
}

function renderGate() {
  const voted = V.server?.voted || {};
  $("#who").innerHTML = PEOPLE.map(id =>
    `<button type="button" data-who="${id}" class="${voted[id] ? "done" : ""}">${label(id)}<small>${voted[id] ? T("voted") : T("notVoted")}</small></button>`).join("");
}
function openGate() { renderGate(); $("#gate").hidden = false; $("#who button")?.focus(); }
$("#who").addEventListener("click", e => {
  const id = e.target.closest("[data-who]")?.dataset.who; if (!id) return;
  V.me = id; store.set("me", id);
  V.list = (store.get("list:" + id) || []).filter(x => byId[x]);
  V.open = V.list.length > 0;
  setStatus("");
  $("#gate").hidden = true;
  renderVote();
});
$("#justLooking").addEventListener("click", () => { V.me = null; store.set("me", null); $("#gate").hidden = true; renderVote(); });
$("#switchWho").addEventListener("click", openGate);
$("#startVote").addEventListener("click", openGate);

function saveList() { store.set("list:" + V.me, V.list); }
function toggleTrip(id) {
  if (!V.me) return openGate();
  const i = V.list.indexOf(id);
  if (i >= 0) { V.list.splice(i, 1); setStatus(T("removed", shortName(byId[id]))); }
  else if (V.list.length < 5) { V.list.push(id); setStatus(T("added", shortName(byId[id]), V.list.length)); }
  saveList(); renderVote();
}
document.addEventListener("click", e => {
  const id = e.target.closest("[data-add]")?.dataset.add;
  if (id) { e.preventDefault(); toggleTrip(id); }
});
$("#mylist").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const i = +b.dataset.i, act = b.dataset.act;
  if (act === "up" && i > 0) [V.list[i - 1], V.list[i]] = [V.list[i], V.list[i - 1]];
  if (act === "down" && i < V.list.length - 1) [V.list[i + 1], V.list[i]] = [V.list[i], V.list[i + 1]];
  if (act === "remove") V.list.splice(i, 1);
  saveList(); renderVote();
});
$("#trayToggle").addEventListener("click", () => { V.open = !V.open; renderVote(); });
$("#submitVote").addEventListener("click", async () => {
  if (V.list.length !== 5 || V.saving) return;
  V.saving = true; setStatus(T("saving"));
  try {
    V.server = await api("POST", { voter: V.me, ranking: V.list });
    const left = PEOPLE.filter(id => !V.server.voted[id]).length;
    setStatus(left ? T("saved", left) : T("savedAll"));
    V.open = false;
  } catch (err) { setStatus(err.message, true); }
  V.saving = false; renderVote(); renderFamily();
});
function setStatus(t, err) { const s = $("#voteStatus"); s.textContent = t; s.classList.toggle("err", !!err); }

function syncAddButtons() {
  document.querySelectorAll("[data-add]").forEach(b => {
    b.hidden = !V.me;
    const i = V.list.indexOf(b.dataset.add), full = V.list.length >= 5;
    b.classList.toggle("in", i >= 0);
    b.disabled = i < 0 && full;
    b.textContent = b.classList.contains("addmini")
      ? (i >= 0 ? `#${i + 1}` : T("addMini"))
      : (i >= 0 ? T("inTop", i + 1) : full ? T("full") : T("add"));
  });
}

function renderVote() {
  renderBrowser();
  document.body.classList.toggle("voting", !!V.me);
  $("#tray").hidden = !V.me;
  $("#startVote").hidden = !!V.me;
  syncAddButtons();
  if (!V.me) return;
  const n = V.list.length, done = V.server?.voted?.[V.me];
  $("#trayTitle").textContent = T("trayTitle", label(V.me), n);
  $("#trayHint").textContent = n < 5 ? T("hintPick") : done ? T("hintDone") : T("hintOrder");
  if (!$("#voteStatus").textContent) setStatus(n < 5 ? T("stPick") : done ? T("stDone") : T("stReady"));
  $("#submitVote").disabled = n !== 5 || V.saving;
  $("#submitVote").textContent = done ? T("update") : T("submit");
  $("#trayToggle").textContent = V.open ? T("close") : T("list");
  $("#trayToggle").setAttribute("aria-expanded", V.open);
  $("#trayMore").hidden = !V.open;
  $("#mylist").innerHTML = n ? V.list.map((id, i) => `<li>
      <span class="rk">${i + 1}</span>
      <span class="nm">${esc(L(byId[id], "name"))}<small>${money(byId[id].costPP.trip)} &middot; ${temp1(byId[id].weather.highF)}</small></span>
      <span class="ctl">
        <button type="button" data-act="up" data-i="${i}" aria-label="${T("up")}" ${i === 0 ? "disabled" : ""}>&#9650;</button>
        <button type="button" data-act="down" data-i="${i}" aria-label="${T("down")}" ${i === n - 1 ? "disabled" : ""}>&#9660;</button>
        <button type="button" data-act="remove" data-i="${i}" aria-label="${T("remove")}">&#10005;</button>
      </span></li>`).join("")
    : `<li class="empty">${T("emptyList")}</li>`;
}

function renderFamily() {
  const s = V.server;
  $("#votedrow").innerHTML = s
    ? PEOPLE.map(id => `<span class="${s.voted[id] ? "yes" : ""}">${label(id)}: ${s.voted[id] ? T("votedShort") : T("notYet")}</span>`).join("")
    : `<span>${esc(V.err ? T(V.err) : T("loading"))}</span>`;
  const ol = $("#results");
  ol.hidden = !(s && s.complete && s.results);
  if (ol.hidden) return;
  const res = s.results.filter(r => byId[r.id]);
  const top = res.length ? res[0].points : 1;
  ol.innerHTML = res.map((r, i) => `<li>
    <span class="rk">${i + 1}</span>
    <span><a href="#${esc(r.id)}">${esc(L(byId[r.id], "name"))}</a><div class="bar" style="width:${Math.max(6, r.points / top * 100)}%"></div></span>
    <span class="pts">${T("pts", r.points)}</span></li>`).join("");
}

async function loadVotes() {
  try { V.server = await api("GET"); V.err = null; }
  catch (err) { V.err = location.protocol === "file:" ? "fileCopy" : (err.message === T("connErr") ? "connErr" : "notConnected"); }
  renderFamily(); renderVote(); if (!$("#gate").hidden) renderGate();
}

document.querySelectorAll("#tbl th button").forEach(btn => btn.addEventListener("click", () => {
  const k = btn.parentElement.dataset.k;
  sort = { k, dir: sort.k === k ? -sort.dir : 1 }; apply();
}));

function renderStatic() {
  document.documentElement.lang = LANG;
  document.title = T("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  $("#cards").innerHTML = ORDER.map(card).join("");
  $("#picklist").innerHTML = DATA.recs.filter(r => byId[r.id]).map((r, i) => {
    const d = byId[r.id];
    return `<a class="pick ${i === 0 ? "first" : ""}" href="#${esc(d.id)}" style="color:inherit;text-decoration:none">
      ${photo((d.heroPhotos || [])[0], "", false)}
      <div class="pb">${i === 0 ? `<span class="firstpill">${T("firstPick")}</span>` : ""}<div class="rank">${i + 1}</div><h3>${esc(L(d, "name"))}</h3>
        <p>${T("pickMeta", money(d.costPP.trip), temp1(d.weather.highF), d.passport)}</p>
        <p style="margin-top:6px">${esc(LANG === "vi" && r.vi ? r.vi : r.why)}</p></div>
    </a>`;
  }).join("");
  $("#foot").textContent = T("foot");
}
function setLang(l) {
  if (l === LANG) return;
  LANG = l; store.set("lang", l);
  renderStatic(); apply(); renderFamily(); renderVote(); renderGate();
}
document.addEventListener("click", e => { const l = e.target.closest("[data-lang]")?.dataset.lang; if (l) setLang(l); });

renderStatic();
apply();
renderFamily();
renderVote();
fromHash();
if (!V.me) openGate();
loadVotes();
</script>
</body>
